[package]
name = "vanaila-chat"
version = "0.3.1-fix"
description = "Privacy-first, high-performance local AI chat client with multi-provider LLM support"
authors = ["Aulia Satrio Wibowo <care@vanaila.com>"]
license = "MIT"
repository = "https://github.com/coderaulia/vanailachat"
homepage = "https://github.com/coderaulia/vanailachat"
edition = "2021"

[lib]
name = "vanaila_chat_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
tauri-plugin-global-shortcut = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
futures = "0.3"
async-stream = "0.3"
urlencoding = "2.1"
url = "2.5"
hex = "0.4"

reqwest = { version = "0.12", features = ["json", "stream", "rustls-tls"] }
eventsource-stream = "0.2"

rusqlite = { version = "0.32", features = ["bundled"] }
rusqlite_migration = "1"

scraper = "0.22"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
dirs = "5"
dotenvy = "0.15"
parking_lot = "0.12"
async-trait = "0.1"
regex = "1"
thiserror = "2"
log = "0.4"
env_logger = "0.11"

[profile.release]
strip = true
lto = true
codegen-units = 1
opt-level = 3
panic = "abort"
